# Game-rule tests (Domain + Application) on plain .NET. No Unity license needed, runs in ~1 minute.
name: Domain tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tools/DomainTests/DomainTests.csproj --logger "trx;LogFileName=domain-tests.trx" --results-directory TestResults

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: TestResults
